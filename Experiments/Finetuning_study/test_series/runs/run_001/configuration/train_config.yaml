setup:
  yolo_base_model: yolo26s.pt
  experiment_group: Finetuning_study
  experiment_name: test_series
dataset:
  family: finetuning_study
  name: mock_battery_step_test
experiment_series:
  enable: false
  mode: grid
  sample_runs: null
  seed_repeats: 2
training_params:
  trainability_policy: head_and_last_stage
  target:
    precision: 0.0
    recall: 0.6
    map50: 0.0
    map50_95: 0.4
  epochs: 10
  batch_size: 2
  learning_rate: 0.0001
  optimizer: AdamW
  img_size: 1280
  multi_scale: false
  weight_decay: 0.0005
  seed: 1001771067
runtime_settings:
  device: gpu
  workers: 8
  amp: true
augmentation_config:
  augmentation: true
  flipud: 0.3
  fliplr: 0.5
  mosaic: 0.1
  mixup: 0.0
  hsv_h: 0.01
  hsv_s: 0.15
  hsv_v: 0.15
