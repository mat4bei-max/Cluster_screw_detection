# ============================================================
# Example YOLO evaluation configuration
# ============================================================
# This config uses logical names from the standard project
# structure instead of direct file paths.
# ============================================================

# ------------------------------------------------------------
# Evaluation, model & dataset setup
# ------------------------------------------------------------
setup:
  evaluation_name: example_eval
  # Output folder under Experiments/

  experiment_group: Model_Name
  # Model family folder under Experiments/

  experiment_name: 1.0
  # Model version folder is resolved as Experiments/<experiment_group>/<experiment_name>

  dataset: Dataset_Name
  # Dataset folder under Datasets/

  split: test
  # Dataset split to evaluate: val or test

# ------------------------------------------------------------
# Model checkpoint selection
# ------------------------------------------------------------
model:
  weights: best.pt
  # Checkpoint file under Run/weights, e.g. best.pt or last.pt

# ------------------------------------------------------------
# Validation parameters passed to Ultralytics model.val()
# ------------------------------------------------------------
validation_params:
  imgsz: 640
  # Image size for validation

  batch: 16
  # Batch size

  conf: 0.25
  # Confidence threshold

  iou: 0.7
  # IoU threshold for NMS

