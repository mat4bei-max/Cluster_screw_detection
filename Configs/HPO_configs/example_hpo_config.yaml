# ============================================================
# Example HPO configuration for YOLO training with Optuna
# ============================================================
# This config defines:
# - how Optuna runs (trials, sampler, pruner)
# - which hyperparameters may be optimized
# - realistic and safe search ranges for YOLO
# - multi-fidelity behavior (epochs during HPO)
#
# IMPORTANT:
# - This config ONLY defines parameters that may be varied
# - Those parameters will OVERRIDE the base training config
# - All other parameters remain unchanged in the training config
# ============================================================


# ----------------------------
# Optuna study configuration
# ----------------------------
optuna:
  study_name: yolo_hpo_example
  direction: maximize               # maximize validation metric (e.g. mAP) 
  metric_to_optimize: map50-95      # Only the following are allowed: map50, map50-95, precision, recall
  n_trials: 50                      # total number of trials
  seed: 42                          # for reproducibility
  storage: sqlite:///optuna.db      # allows resume after crash or timeout


# ----------------------------
# Sampler configuration
# ----------------------------
sampler:
  type: TPE                         # Tree-structured Parzen Estimator
  n_startup_trials: 10              # random trials before Bayesian optimization
  multivariate: true                # model parameter interactions


# ----------------------------
# Pruner configuration
# ----------------------------
pruner:
  type: ASHA                        # Asynchronous Successive Halving
  min_resource: 10                   # minimum number of epochs before pruning
  reduction_factor: 3               # keep ~1/3 of trials per rung


# ----------------------------
# Multi-fidelity configuration
# ----------------------------
fidelity:
  hpo_epochs: 50                    # number of epochs used during HPO trials
                                    # (full training happens after HPO)


# ============================================================
# Hyperparameter search space
# ============================================================
# Keys MUST match the training config structure exactly.
# Each parameter defined here will override the training config.
# Parameters not used in hpo can be marked as comments (strg+#)
# ============================================================

search_space:

  # ----------------------------------------------------------
  # Optimization / learning parameters
  # ----------------------------------------------------------

  training_params.learning_rate:
    type: float
    low: 1e-5
    high: 1e-2
    log: true
    # Log scale is critical for learning rate optimization

  training_params.weight_decay:
    type: float
    low: 1e-6
    high: 5e-4
    log: true
    # Regularization strength; too high hurts convergence

  training_params.optimizer:
    type: categorical
    choices: [SGD, Adam, AdamW]
    # AdamW is often best, but SGD can outperform on large datasets

  training_params.batch_size:
    type: categorical
    choices: [8, 16, 32]
    # Limited by GPU memory; categorical avoids invalid values


  # ----------------------------------------------------------
  # Image & input-related parameters
  # ----------------------------------------------------------

  training_params.img_size:
    type: categorical
    choices: [512, 640] # Multiple of 32!
    # Activating img_size for HPO might cause instability
    # Higher resolution improves small-object detection
    # but increases memory usage and runtime


  # ----------------------------------------------------------
  # Data augmentation parameters
  # ----------------------------------------------------------

  augmentation_config.mosaic:
    type: categorical
    choices: [0.0, 0.5, 1.0]
    # Mosaic is powerful but can hurt convergence if overused

  augmentation_config.mixup:
    type: float
    low: 0.0
    high: 0.3
    # MixUp improves generalization but harms localization if too strong

  augmentation_config.hsv_h:
    type: float
    low: 0.0
    high: 0.05
    # Hue augmentation; small values are usually sufficient

  augmentation_config.hsv_s:
    type: float
    low: 0.0
    high: 0.7
    # Saturation augmentation; higher values increase robustness

  augmentation_config.hsv_v:
    type: float
    low: 0.0
    high: 0.4
    # Brightness augmentation


  # ----------------------------------------------------------
  # Training stability & regularization
  # ----------------------------------------------------------

  training_params.multi_scale:
    type: categorical
    choices: [true, false]
    # Activating multi_scale for HPO might cause instability
    # Multi-scale improves robustness but slows training


# ============================================================
# Final training configuration
# ============================================================
# Settings for the final full training after HPO are defined in training config file
# ============================================================


